name: workspace

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres_initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
      tpp_db:
        ipv4_address: 172.31.250.10


  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - jellyfin_config:/config
      - /mnt/SSD/Videos:/mnt/SSD/Videos:ro
    ports:
      - 8096:8096

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: "host"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./tailscale:/config:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW

  linkding:
    image: sissbruecker/linkding:latest
    restart: unless-stopped
    volumes:
      - linkding_data:/etc/linkding/data
    environment:
      - LD_SUPERUSER_NAME=${SUPERUSER_NAME}
      - LD_SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - LD_DB_ENGINE=postgres
      - LD_DB_DATABASE=${LINKDING_DB_NAME}
      - LD_DB_USER=${LINKDING_DB_USER}
      - LD_DB_PASSWORD=${LINKDING_DB_PASSWORD}
      - LD_DB_HOST=postgres
    ports:
      - 9090:9090
    depends_on:
      postgres:
        condition: service_healthy

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    volumes:
      - transmission_data:/config
      - /mnt/SSD/Downloads:/downloads
      - /mnt/SSD/Torrents:/watch
      - /mnt/SSD:/mnt/SSD
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${SUPERUSER_NAME}
      - PASS=${SUPERUSER_PASSWORD}
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp

  the-private-project-backend:
    image: registry.gitlab.com/dhwanil-ditani/the-private-project/backend:dev
    restart: unless-stopped
    network_mode: "service:gluetun"   # every outbound connection goes through the VPN
    environment:
      - POSTGRES_USER=${THE_PRIVATE_PROJECT_DB_USER}
      - POSTGRES_PASSWORD=${THE_PRIVATE_PROJECT_DB_PASSWORD}
      - POSTGRES_HOST=172.31.250.10
      - POSTGRES_DB=${THE_PRIVATE_PROJECT_DB_NAME}
      - VIDEOS_STORAGE_PATH=/data/videos
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_SESSION_FILE=/data/telegram/telegram_session
      - TELEGRAM_UPLOAD_CONCURRENCY=2
      - TELEGRAM_DOWNLOAD_CONCURRENCY=2
      - FETCH_CONCURRENCY=2
      - TMPDIR=/data/temp
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH}
      - AUTH_API_TOKEN=${AUTH_API_TOKEN}
    volumes:
      - /mnt/SSD/Videos/the-private-project:/data/videos
      - telegram_data:/data/telegram
      - /mnt/SSD/tmp/the-private-project:/data/temp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true                 # compose restarts the backend when it restarts Gluetun
      postgres:
        condition: service_healthy
  
  the-private-project-frontend:
    image: registry.gitlab.com/dhwanil-ditani/the-private-project/frontend:dev
    restart: unless-stopped
    ports:
      - 3000:80
    environment:
      - BACKEND_HOST=gluetun
      - BACKEND_PORT=8000
    depends_on:
      the-private-project-backend:
        condition: service_healthy
        restart: true
  
  gluetun:
    image: qmcgaw/gluetun:v3          # qdm12's official image, not a fork
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ}
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${PROTON_SERVER_COUNTRIES}   # e.g. Netherlands
      # The one local network the backend may reach outside the tunnel: Postgres.
      # Local: Postgres. Public: Telegram's data centres (core.telegram.org/resources/cidr.txt),
      # routed outside the tunnel so archive/restore isn't bottlenecked by the VPN.
      - FIREWALL_OUTBOUND_SUBNETS=172.31.250.0/24,91.108.4.0/22,91.108.8.0/22,91.108.12.0/22,91.108.16.0/22,91.108.20.0/22,91.108.56.0/22,91.105.192.0/23,149.154.160.0/20,185.76.151.0/24
      # Its control server defaults to :8000, which the backend needs.
      - HTTP_CONTROL_SERVER_ADDRESS=:8001
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE='{"auth":"none"}'
    ports:
      - 8001:8001
    networks:
      - default
      - tpp_db

volumes:
  postgres_data:
  jellyfin_config:
  tailscale_data:
  linkding_data:
  transmission_data:
  telegram_data:

networks:
  tpp_db:
    ipam:
      config:
        - subnet: 172.31.250.0/24

name: workspace

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # See https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers/protonvpn.md
      - VPN_SERVICE_PROVIDER=protonvpn
      # --- WireGuard (Recommended for Raspberry Pi) ---
      - VPN_TYPE=wireguard
      # Get your WireGuard private key from ProtonVPN dashboard:
      # ProtonVPN → Downloads → WireGuard configuration (enable NAT-PMP!)
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Enable port forwarding for qBittorrent inbound connections
      - VPN_PORT_FORWARDING=on
      # Optional: Uncomment and use OpenVPN instead of WireGuard
      # - VPN_TYPE=openvpn
      # - OPENVPN_USER=${OPENVPN_USER}
      # - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      # Server selection (optional, e.g., Netherlands)
      - SERVER_COUNTRIES=Netherlands
    ports:
      - "8096:8096" # Jellyfin Web UI
      - "9090:9090" # Linkding Web UI
      - "8080:80" # Nextcloud Web UI (Accessible via http://<ip>:8080)
      - "8081:8081" # qBittorrent Web UI
      - "6881:6881" # qBittorrent TCP
      - "6881:6881/udp" # qBittorrent UDP
    volumes:
      - ./gluetun:/gluetun
    healthcheck:
      test: [ "CMD", "/gluetun-entrypoint", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres
    network_mode: "service:gluetun"
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      gluetun:
        condition: service_healthy

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    network_mode: "service:gluetun"
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=localhost
    volumes:
      - ./nextcloud/html:/var/www/html
      - ./php-jit-fix.ini:/usr/local/etc/php/conf.d/zz-jit-fix.ini:ro
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      db:
        condition: service_healthy

  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    network_mode: "service:gluetun"
    environment:
      - LD_DB_ENGINE=postgres
      - LD_DB_DATABASE=linkding
      - LD_DB_USER=${POSTGRES_USER}
      - LD_DB_PASSWORD=${POSTGRES_PASSWORD}
      - LD_DB_HOST=localhost
      - LD_DB_PORT=5432
    volumes:
      - ./linkding/data:/etc/linkding/data
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
      db:
        condition: service_healthy

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - ./jellyfin/config:/config
      - /home/dhwanil/Shows/:/Shows
      - ./jellyfin/movies:/data/movies
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8081
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/downloads:/downloads
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    network_mode: "host"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - ./tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

# Monitoring + management stack for Raspberry Pi 5 homelab
# Run alongside your existing docker-compose.yml (separate file/project,
# or merge these services into your main compose file if you prefer).
#
# Usage:
#   docker compose -f docker-compose.monitoring.yml up -d
#
# After first run:
#   1. Open http://<pi-tailscale-ip>:8090 -> create Beszel admin user
#   2. Click "Add system" -> name it (e.g. "pi5") -> it gives you a KEY + TOKEN
#   3. Paste those into the beszel-agent environment below, then:
#        docker compose -f docker-compose.monitoring.yml up -d beszel-agent
#   4. In the "Add system" dialog, set Host to: /beszel_socket/beszel.sock
#   5. Open http://<pi-tailscale-ip>:9000 -> set up Portainer admin user

services:
  # ---------- Beszel: lightweight monitoring (hub) ----------
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - "8090:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  # ---------- Beszel: agent (collects stats from this Pi) ----------
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host   # needed for accurate network interface stats
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: "12bf-a809baad69-8bd7-b184ae6cd"
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINYvumdxjaondd+L1VEgYaatzOugVaZmZmMj0aEAOAOO"

  # ---------- Portainer CE: remote container management ----------
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer_data:/data

  # ---------- Optional: Uptime Kuma (uncomment to enable) ----------
  # Simple uptime/status checks for your self-hosted services
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime_kuma_data:/app/data

